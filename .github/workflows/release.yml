# Builds a draft GitHub release from Actions > Release > Run workflow, given a version such as 1.2.0.
# It runs the tests and builds through build.yml, then attaches one download per platform and their SHA-256 sums.
# The draft holds the v<version> tag without creating it: publishing the draft creates the tag on the commit the
# workflow ran on. Running it again for the same version replaces the draft.
# A version with a hyphen, such as 1.2.0-beta.1, makes a prerelease.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as 1.2.0 or 1.2.0-beta.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Fails before the build when the version was released already, as publishing a release creates its tag.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is free
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2> /dev/null; then
            echo "::error::Tag $tag exists, so version ${VERSION#v} was released already"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: simple-bike-trainer-*
          path: downloads
          merge-multiple: true

      - name: Checksums
        working-directory: downloads
        run: sha256sum simple-bike-trainer-* > SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null)" == true ]]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$tag" downloads/* --repo "$GITHUB_REPOSITORY" --title "$tag" --target "$GITHUB_SHA" \
            --generate-notes --draft "${prerelease[@]}"
