# Tests every push and pull request, then builds the downloads: one file per desktop platform, and an Android APK. It
# also checks that the iPad app builds.
# release.yml calls this workflow for v* tags and attaches the downloads to the release.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check XAML formatting
        run: |
          dotnet tool restore
          DOTNET_ROLL_FORWARD=Major dotnet xstyler --recursive --directory . --passive
      # Windows builds use the WinRT Bluetooth API; this catches a break there before the publish job.
      - name: Build for Windows
        run: dotnet build SimpleBikeTrainer.slnx -p:WindowsBuild=true
      - name: Test
        run: dotnet test --solution SimpleBikeTrainer.slnx
        env:
          SIMPLE_BIKE_TRAINER_SCREENSHOTS: ${{ github.workspace }}/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  # The Android tablet app: one APK for arm64 and x64 tablets.
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Android workload
        run: dotnet workload install android

      # As for the desktop app, plus Android's version code, which has to grow from release to release: 1.2.3 is 10203.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      # Android installs an update only over an APK signed with the same key. Without the secrets, the APK gets the
      # SDK's debug key, made fresh on each runner.
      - name: Signing key
        id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE" ]]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "args=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish src/SimpleBikeTrainer.Desktop -c Release -f net10.0-android -p:AndroidBuild=true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} \
            -p:ApplicationVersion=${{ steps.version.outputs.code }} \
            ${{ steps.signing.outputs.args }} -o publish
          cp publish/*-Signed.apk simple-bike-trainer-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: simple-bike-trainer-android
          path: simple-bike-trainer-android.apk
          if-no-files-found: error

  # The iPad app: a check that it builds, for the simulator, which needs no signing certificate. There is no download:
  # an iPad installs only an app signed for it, so each rider builds and signs their own (see the README).
  ios:
    needs: test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install the iOS workload
        run: dotnet workload install ios
      - name: Build
        run: dotnet build src/SimpleBikeTrainer.Desktop -c Release -f net10.0-ios -r iossimulator-arm64 -p:IosBuild=true

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          # Native AOT compiles for the machine it runs on.
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A v* tag sets the version; other builds are 0.0.<run number>. A called workflow sees the caller's tag.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Native AOT links with clang.
      - name: Install the native AOT tools
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Windows: one trimmed, self-contained file, with Skia's native libraries inside it; they unpack to a cache folder
      # on the first start. Native AOT cannot embed those libraries, so it would ship four files.
      # macOS and Linux: native AOT, with the libraries beside the app: in the .app bundle on macOS, in a tarball on
      # Linux.
      - name: Publish
        run: |
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mode="--self-contained -p:PublishTrimmed=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true"
          else
            mode="-p:PublishAot=true"
          fi
          dotnet publish src/SimpleBikeTrainer.Desktop -c Release -r ${{ matrix.rid }} $mode \
            -p:Version=${{ steps.version.outputs.version }} -p:DebugType=none -o publish
          # SkiaSharp's packages drop their native .pdb files next to the app.
          rm -f publish/*.pdb publish/*.dbg
          rm -rf publish/*.dSYM

      - name: Name the download
        if: startsWith(matrix.rid, 'win-')
        run: cp publish/simple-bike-trainer.exe simple-bike-trainer-${{ matrix.rid }}.exe

      - name: Package for Linux
        if: startsWith(matrix.rid, 'linux-')
        run: |
          mkdir simple-bike-trainer
          cp publish/simple-bike-trainer publish/*.so simple-bike-trainer/
          tar -czf simple-bike-trainer-${{ matrix.rid }}.tar.gz simple-bike-trainer

      # Ad-hoc signed only: macOS asks before the first launch (see the README).
      - name: Package for macOS
        if: startsWith(matrix.rid, 'osx-')
        run: |
          app="Simple Bike Trainer.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/ "$app/Contents/MacOS/"
          sed "s/VERSION/${{ steps.version.outputs.version }}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=icon.iconset
          mkdir $iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size src/SimpleBikeTrainer.Desktop/Assets/icon.png --out $iconset/icon_${size}x${size}.png > /dev/null
            sips -z $((size * 2)) $((size * 2)) src/SimpleBikeTrainer.Desktop/Assets/icon.png --out $iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns $iconset -o "$app/Contents/Resources/icon.icns"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" simple-bike-trainer-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: simple-bike-trainer-${{ matrix.rid }}
          path: simple-bike-trainer-${{ matrix.rid }}*
          if-no-files-found: error
