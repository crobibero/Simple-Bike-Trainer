# Tests every push and pull request, then builds the downloads: one file per desktop platform, and an Android APK per
# processor. It also checks that the iPad app builds.
# release.yml calls this workflow with a version and attaches the downloads to a draft release.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version, such as 1.2.0
        type: string
        default: ""
    outputs:
      version:
        description: The version the downloads carry
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check XAML formatting
        run: |
          dotnet tool restore
          DOTNET_ROLL_FORWARD=Major dotnet xstyler --recursive --directory . --passive
      # Windows builds use the WinRT Bluetooth API; this catches a break there before the publish job.
      - name: Build for Windows
        run: dotnet build SimpleBikeTrainer.slnx -p:WindowsBuild=true
      - name: Test
        run: dotnet test --solution SimpleBikeTrainer.slnx
        env:
          SIMPLE_BIKE_TRAINER_SCREENSHOTS: ${{ github.workspace }}/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  # release.yml passes the version; other builds are 0.0.<run number>. A leading v is dropped.
  # Android's version code is major * 10000 + minor * 100 + patch, so a version with minor or patch above 99, or not in
  # MAJOR.MINOR.PATCH[-PRERELEASE] form, fails here. The check also keeps shell syntax out of the version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      args: ${{ steps.version.outputs.args }}
    steps:
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Version $INPUT_VERSION is not MAJOR.MINOR.PATCH[-PRERELEASE] with MINOR and PATCH below 100"
              exit 1
            fi
            code=$((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))
            echo "args=-p:ReleaseBuild=true" >> "$GITHUB_OUTPUT"
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
            code="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The Android tablet app: an APK each for arm64 and x64 tablets, as one APK for both is twice the size.
  android:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      DOWNLOAD_NAME: simple-bike-trainer-${{ matrix.rid }}-${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Android workload
        run: dotnet workload install android

      - name: Install the Android NDK
        id: ndk
        run: |
          version=28.2.13676358
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$version" > /dev/null
          echo "dir=$ANDROID_HOME/ndk/$version" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE" ]]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "args=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish src/SimpleBikeTrainer.Desktop -c Release -f net10.0-android -r ${{ matrix.rid }} -p:AndroidBuild=true \
            -p:AndroidNdkDirectory=${{ steps.ndk.outputs.dir }} \
            -p:Version="$APP_VERSION" -p:ApplicationDisplayVersion="$APP_VERSION" \
            -p:ApplicationVersion=${{ needs.version.outputs.code }} \
            ${{ needs.version.outputs.args }} ${{ steps.signing.outputs.args }} -o publish
          cp publish/*-Signed.apk "$DOWNLOAD_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: simple-bike-trainer-${{ matrix.rid }}
          path: ${{ env.DOWNLOAD_NAME }}.apk
          if-no-files-found: error

  # The iPad app: a check that it compiles with native AOT, unsigned, as no signing certificate is at hand. There is no
  # download: an iPad installs only an app signed for it, so each rider builds and signs their own (see the README).
  ios:
    needs: test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install the iOS workload
        run: dotnet workload install ios
      # Each iOS workload needs a matching Xcode, and the image's default can trail the latest workload.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Publish
        run: |
          dotnet publish src/SimpleBikeTrainer.Desktop -c Release -f net10.0-ios -r ios-arm64 -p:IosBuild=true \
            -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:BuildIpa=false

  publish:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          # Native AOT compiles for the machine it runs on.
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      DOWNLOAD_NAME: simple-bike-trainer-${{ matrix.rid }}-${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Native AOT links with clang; StaticLink.Avalonia switches the linker to lld and links fontconfig.
      - name: Install the native AOT tools
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y clang lld zlib1g-dev libfontconfig-dev

      # Native AOT everywhere. On Windows and Linux, StaticLink.Avalonia links Skia's libraries into the app, so it is
      # one file; on macOS they go in the .app bundle.
      - name: Publish
        run: |
          dotnet publish src/SimpleBikeTrainer.Desktop -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -p:Version="$APP_VERSION" -p:DebugType=none -o publish
          # SkiaSharp's packages drop their native .pdb files next to the app.
          rm -f publish/*.pdb publish/*.dbg
          rm -rf publish/*.dSYM

      - name: Name the download
        if: startsWith(matrix.rid, 'win-')
        run: cp publish/simple-bike-trainer.exe "$DOWNLOAD_NAME.exe"

      # One file, like the Windows .exe. A browser download drops its executable bit (see the README).
      - name: Name the download for Linux
        if: startsWith(matrix.rid, 'linux-')
        run: cp publish/simple-bike-trainer "$DOWNLOAD_NAME"

      # Ad-hoc signed only: macOS asks before the first launch (see the README).
      - name: Package for macOS
        if: startsWith(matrix.rid, 'osx-')
        run: |
          app="Simple Bike Trainer.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/ "$app/Contents/MacOS/"
          sed "s/VERSION/$APP_VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=icon.iconset
          mkdir $iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size src/SimpleBikeTrainer.Desktop/Assets/icon.png --out $iconset/icon_${size}x${size}.png > /dev/null
            sips -z $((size * 2)) $((size * 2)) src/SimpleBikeTrainer.Desktop/Assets/icon.png --out $iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns $iconset -o "$app/Contents/Resources/icon.icns"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "$DOWNLOAD_NAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: simple-bike-trainer-${{ matrix.rid }}
          path: ${{ env.DOWNLOAD_NAME }}*
          if-no-files-found: error
